<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Final World — Masuk</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(#1b2a8f,#05061a);color:#fff;font-family:"Courier New",monospace}
.card{width:min(360px,92vw);background:linear-gradient(#1b2a8f,#0d1553);border:2px solid #fff;border-radius:8px;padding:18px}
h1{margin:0 0 4px;text-align:center;color:#ffd54f;text-shadow:2px 2px 0 #000;font-size:30px}
.sub{text-align:center;font-size:12px;opacity:.8;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;background:#0a1040;color:#fff;border:1px solid #6b7bff;border-radius:4px;font-family:inherit}
.tabs button.on{background:#2b3bd0}
label{display:block;font-size:12px;margin:8px 0 3px}
input,select{width:100%;padding:10px;background:#05082a;color:#fff;border:1px solid #6b7bff;border-radius:4px;font-family:inherit;font-size:14px}
.go{width:100%;margin-top:14px;padding:12px;font-size:15px;background:#2b3bd0;color:#fff;border:2px solid #fff;border-radius:6px;font-family:inherit}
#msg{min-height:18px;margin-top:10px;font-size:12px;color:#ff8a80;text-align:center}
.hide{display:none}
.hint{font-size:11px;opacity:.7;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <h1>Final World</h1>
  <div class="sub">Masuk untuk bermain atau mengembangkan</div>
  <div class="tabs"><button id="tLogin" class="on" type="button">Login</button><button id="tReg" type="button">Register</button></div>
  <form id="f" autocomplete="off">
    <label>Username</label><input id="u" autocapitalize="none" autocomplete="username">
    <label>Password</label><input id="p" type="password" autocomplete="current-password">
    <div id="regBox" class="hide">
      <label>Daftar sebagai</label>
      <select id="role"><option value="player">Player (main game)</option><option value="developer">Developer (editor)</option></select>
      <div id="keyBox" class="hide"><label>Kunci developer</label><input id="dk" type="password"><div class="hint">Bawaan: FW-DEV (bisa diganti di editor → Pengaturan).</div></div>
    </div>
    <button class="go" id="go" type="submit">Login</button>
  </form>
  <div id="msg"></div>
</div>
<script src="common.js"></script>
<script>
(function () {
  const { Auth } = FW, $ = (i) => document.getElementById(i);
  const s = Auth.session(); if (s) { location.replace(Auth.home(s.role)); return; }
  let reg = false;
  function mode(r) {
    reg = r; $('tLogin').className = r ? '' : 'on'; $('tReg').className = r ? 'on' : '';
    $('regBox').classList.toggle('hide', !r); $('go').textContent = r ? 'Buat Akun' : 'Login'; $('msg').textContent = '';
    $('p').autocomplete = r ? 'new-password' : 'current-password';
  }
  $('tLogin').onclick = () => mode(false); $('tReg').onclick = () => mode(true);
  $('role').onchange = () => $('keyBox').classList.toggle('hide', $('role').value !== 'developer');
  $('f').onsubmit = (e) => {
    e.preventDefault();
    const r = reg ? Auth.register($('u').value, $('p').value, $('role').value, $('dk').value) : Auth.login($('u').value, $('p').value);
    if (!r.ok) { $('msg').textContent = r.msg; return; }
    location.href = Auth.home(r.role);
  };
})();
</script>
</body>
</html>
