<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Final World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="cv" width="256" height="192"></canvas>
    <div id="hud"></div>
    <div id="dialog" class="hidden"></div>
    <div id="panel" class="hidden"></div>
    <div id="battle" class="hidden"></div>
    <canvas id="fx"></canvas>
    <div id="title">
      <h1 id="gtitle">Final World</h1>
      <div id="who" class="small"></div>
      <div id="worldList"></div>
      <div id="worldDetail"></div>
      <a id="lnkEditor" class="lnk" href="../editor/index.html">Buka Maker (Creative)</a>
      <button id="btnSound" class="ghost">Suara: Nyala</button>
      <button id="btnLogout" class="ghost">Logout</button>
    </div>
    <div id="loading">
      <div class="ld-in">
        <h1>Final World</h1>
        <div class="ld-bar"><i id="ldFill"></i></div>
        <div id="ldPct" class="small">0%</div>
        <div id="ldMsg" class="small">Memuat data...</div>
      </div>
    </div>
  </div>
  <div id="pad">
    <div id="dpad">
      <button data-k="up">▲</button>
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
      <button data-k="down">▼</button>
    </div>
    <div id="acts">
      <button data-k="menu">MENU</button>
      <button data-k="b">B</button>
      <button data-k="a">A</button>
    </div>
  </div>
</div>
<script src="../data/game.js"></script>
<script src="../common.js"></script>
<script src="../sfx.js"></script>
<script src="genmap.js"></script>
<script src="engine.js"></script>
</body>
</html>
